name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job only reads the repositories it checks out.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint:ci
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

  # SonarQube Cloud, in a job of its own so that only the scanner sees the token.
  sonar:
    needs: checks
    runs-on: ubuntu-26.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      # Pull requests from forks and from Dependabot get no secrets, so they skip the scan.
      - if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN is not available, so SonarQube Cloud analysis is skipped."
      # The whole history, which SonarQube Cloud reads to tell new code from old.
      - if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage
      - if: env.SONAR_TOKEN != ''
        name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - if: env.SONAR_TOKEN != ''
        name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=io-timeout
            -Dsonar.projectKey=io-timeout_exemplar

  # The W3C suites and consistency checks, from exemplar-tests, on this change's build.
  conformance:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: exemplar
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/exemplar-tests
          path: exemplar-tests
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: exemplar/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.1
          cache: pnpm
          cache-dependency-path: '*/pnpm-lock.yaml'
      - name: Install xmllint
        run: sudo apt-get install --yes libxml2-utils
      # The XML suite is downloaded on first use, as its licence requires; the cache keeps it between runs.
      - uses: actions/cache@v6.1.0
        with:
          path: exemplar-tests/data/conformance/xmlts
          key: w3c-xmlts-${{ hashFiles('exemplar-tests/tools/conformance/suites.json') }}
      - name: Build exemplar
        working-directory: exemplar
        run: pnpm install --frozen-lockfile && pnpm compile
      - name: Run the suites
        working-directory: exemplar-tests
        run: pnpm install --frozen-lockfile && pnpm conformance

  browsers:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm compile
      - name: Unit tests in Chromium, Firefox and WebKit
        run: pnpm test:browser
