name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job only reads the repositories it checks out.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint:ci
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

  # SonarQube Cloud, in a job of its own so that only the scanner sees the token. Pull requests from forks have no token.
  sonar:
    needs: checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    steps:
      # The whole history, which SonarQube Cloud reads to tell new code from old.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage
      - uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The W3C suites and consistency checks, from exemplar-tests, on this change's build.
  conformance:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: exemplar
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/exemplar-tests
          path: exemplar-tests
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: exemplar/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.1
          cache: pnpm
          cache-dependency-path: '*/pnpm-lock.yaml'
      - name: Install xmllint
        run: sudo apt-get install --yes libxml2-utils
      # The XML suite is downloaded on first use, as its licence requires; the cache keeps it between runs.
      - uses: actions/cache@v6
        with:
          path: exemplar-tests/data/conformance/xmlts
          key: w3c-xmlts-${{ hashFiles('exemplar-tests/tools/conformance/suites.json') }}
      - name: Build exemplar
        working-directory: exemplar
        run: pnpm install --frozen-lockfile && pnpm compile
      - name: Run the suites
        working-directory: exemplar-tests
        run: pnpm install --frozen-lockfile && pnpm conformance

  browsers:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm compile
      - name: Unit tests in Chromium, Firefox and WebKit
        run: pnpm test:browser
