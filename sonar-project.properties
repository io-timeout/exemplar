# SonarQube Cloud analysis, which CI runs after the tests, with the coverage they write.
sonar.organization=io-timeout
sonar.projectKey=io-timeout_exemplar
sonar.projectName=exemplar

# The whole repository is analysed, except the tests and the build output.
sonar.exclusions=packages/*/test/**,packages/*/dist/**

# Build and test configuration, which the tests do not run.
sonar.coverage.exclusions=configs/**,**/*.config.js,**/*.config.ts

# The generated encoding tables are data, which would read as duplicated code.
sonar.cpd.exclusions=packages/*/src/**/tables.ts

# The coverage `pnpm test:coverage` writes, across every package.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
